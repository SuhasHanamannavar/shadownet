<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Sign In — CorpNet Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#f0f4ff;display:flex;align-items:center;justify-content:center;min-height:100vh}
.box{background:white;border-radius:16px;padding:40px 44px;width:420px;box-shadow:0 8px 32px rgba(30,64,175,.1)}
.logo{text-align:center;font-size:22px;font-weight:700;color:#1e40af;margin-bottom:6px}
.sub{text-align:center;color:#6b7280;font-size:14px;margin-bottom:32px}
label{display:block;font-size:13px;font-weight:500;color:#374151;margin-bottom:5px}
input{width:100%;padding:11px 14px;border:1.5px solid #d1d5db;border-radius:8px;font-size:14px;margin-bottom:18px;outline:none;transition:border .2s}
input:focus{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.1)}
.btn{width:100%;padding:12px;background:#1e40af;color:white;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;transition:background .2s}
.btn:hover{background:#1d4ed8}
.hint{text-align:center;font-size:12px;color:#9ca3af;margin-top:20px}
</style>
</head>
<body>
<!-- HONEYPOT PAGE — identical to real login. Attacker has NO idea. -->
<div class="box">
  <div class="logo">CorpNet</div>
  <div class="sub">Enterprise Resource Portal</div>
  <form method="POST">
    <label>Username</label>
    <input type="text" name="username" placeholder="Enter username" autocomplete="off"/>
    <label>Password</label>
    <input type="password" name="password" placeholder="Enter password"/>
    <button type="submit" class="btn">Sign In</button>
  </form>
  <div class="hint">SSO and MFA available for enterprise accounts</div>
</div>
</body>
</html>
