<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>MIRAGE — Live Attack Monitor</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0d1117; color: #c9d1d9; min-height: 100vh; }

header {
  background: #161b22;
  border-bottom: 1px solid #30363d;
  padding: 16px 32px;
  display: flex;
  align-items: center;
  gap: 16px;
}
header h1 { font-size: 18px; font-weight: 600; color: #f0f6fc; }
.badge {
  font-size: 11px;
  font-weight: 600;
  padding: 3px 10px;
  border-radius: 20px;
  letter-spacing: 0.05em;
}
.badge-live { background: #1a3a1a; color: #3fb950; border: 1px solid #238636; animation: pulse 2s ease-in-out infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.6} }
.badge-disconnected { background: #3a1a1a; color: #f85149; border: 1px solid #da3633; }

.stats-bar {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 1px;
  background: #30363d;
  border-bottom: 1px solid #30363d;
}
.stat {
  background: #161b22;
  padding: 16px 24px;
}
.stat-label { font-size: 11px; color: #8b949e; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
.stat-value { font-size: 28px; font-weight: 700; color: #f0f6fc; font-variant-numeric: tabular-nums; }
#stat-attacks { color: #f85149; }
#stat-sql     { color: #d29922; }
#stat-xss     { color: #a371f7; }
#stat-brute   { color: #f78166; }

.main { display: flex; height: calc(100vh - 130px); }

/* Live Feed */
.feed-panel {
  flex: 1;
  display: flex;
  flex-direction: column;
  border-right: 1px solid #30363d;
}
.panel-header {
  padding: 12px 20px;
  border-bottom: 1px solid #30363d;
  font-size: 13px;
  font-weight: 600;
  color: #8b949e;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
#event-count { font-size: 11px; background: #21262d; padding: 2px 8px; border-radius: 10px; color: #8b949e; }

#feed {
  flex: 1;
  overflow-y: auto;
  padding: 8px 0;
  font-size: 12px;
  font-family: 'Cascadia Code', 'Fira Mono', monospace;
}
.feed-row {
  padding: 10px 20px;
  border-bottom: 1px solid #21262d;
  display: grid;
  grid-template-columns: 80px 110px 130px 1fr;
  gap: 12px;
  align-items: center;
  animation: slideIn 0.3s ease;
}
@keyframes slideIn { from { opacity:0; transform: translateX(-8px); } to { opacity:1; transform: translateX(0); } }
.feed-row:hover { background: #21262d; }
.feed-row.new { background: #1c2a1c; }

.time-col  { color: #8b949e; font-size: 11px; }
.ip-col    { color: #79c0ff; }
.type-pill {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 12px;
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  white-space: nowrap;
}
.pill-sql       { background:#2d1e00; color:#d29922; border:1px solid #7a5800; }
.pill-xss       { background:#1f1335; color:#a371f7; border:1px solid #5b3ea6; }
.pill-brute     { background:#2d1500; color:#f78166; border:1px solid #7a3700; }
.pill-credential{ background:#1e1a2d; color:#c8b0f8; border:1px solid #6e54a3; }
.pill-scanner   { background:#1a2535; color:#58a6ff; border:1px solid #1f6feb; }
.pill-traversal { background:#2d2000; color:#e3b341; border:1px solid #9e6a03; }
.pill-terminal  { background:#2d0000; color:#f85149; border:1px solid #b91c1c; }
.pill-attack    { background:#21262d; color:#8b949e; border:1px solid #30363d; }

.path-col { color: #e6edf3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Details sidebar */
.detail-panel {
  width: 320px;
  display: flex;
  flex-direction: column;
  background: #161b22;
}
.detail-content {
  flex: 1;
  padding: 20px;
  overflow-y: auto;
}
#detail-placeholder { color: #8b949e; font-size: 13px; margin-top: 40px; text-align: center; }
.detail-field { margin-bottom: 16px; }
.detail-key { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: #8b949e; margin-bottom: 4px; }
.detail-val { font-size: 13px; color: #e6edf3; word-break: break-all; }
.feature-bar-wrap { margin-top: 4px; }
.feature-row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; font-size: 11px; }
.feature-name { color: #8b949e; width: 80px; flex-shrink: 0; }
.feature-bar { height: 6px; background: #3fb950; border-radius: 3px; min-width: 2px; }
.feature-val { color: #e6edf3; }

/* Scrollbar */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #30363d; border-radius: 2px; }
</style>
</head>
<body>

<header>
  <h1>🛡 MIRAGE Live Monitor</h1>
  <span id="ws-badge" class="badge badge-disconnected">Connecting…</span>
</header>

<div class="stats-bar">
  <div class="stat"><div class="stat-label">Total Attacks</div><div class="stat-value" id="stat-attacks">0</div></div>
  <div class="stat"><div class="stat-label">SQL Injection</div><div class="stat-value" id="stat-sql">0</div></div>
  <div class="stat"><div class="stat-label">XSS</div><div class="stat-value" id="stat-xss">0</div></div>
  <div class="stat"><div class="stat-label">Brute Force</div><div class="stat-value" id="stat-brute">0</div></div>
</div>

<div class="main">
  <div class="feed-panel">
    <div class="panel-header">
      Live event feed
      <span id="event-count">0 events</span>
    </div>
    <div id="feed"></div>
  </div>

  <div class="detail-panel">
    <div class="panel-header">Attack detail</div>
    <div class="detail-content">
      <div id="detail-placeholder">Click any event to inspect it</div>
      <div id="detail-body" style="display:none"></div>
    </div>
  </div>
</div>

<script>
// ── State ──────────────────────────────────────────────────────────────────
const counters = { total: 0, sql_injection: 0, xss: 0, brute_force: 0 };
let eventCount = 0;

// ── WebSocket connection ───────────────────────────────────────────────────
const socket = io('/dashboard');

socket.on('connect', () => {
  document.getElementById('ws-badge').textContent = '● LIVE';
  document.getElementById('ws-badge').className = 'badge badge-live';
});

socket.on('disconnect', () => {
  document.getElementById('ws-badge').textContent = '✕ Disconnected';
  document.getElementById('ws-badge').className = 'badge badge-disconnected';
});

// Bulk load on first connect
socket.on('init_logs', (logs) => {
  logs.slice().reverse().forEach(log => addEvent(log, false));
});

// Real-time new attack push
socket.on('new_attack', (attack) => {
  addEvent(attack, true);
  bumpCounters(attack.attack_type);
});

// ── Helpers ────────────────────────────────────────────────────────────────
function pillClass(type) {
  if (!type) return 'pill-attack';
  if (type.includes('sql'))        return 'pill-sql';
  if (type.includes('xss'))        return 'pill-xss';
  if (type.includes('brute'))      return 'pill-brute';
  if (type.includes('credential')) return 'pill-credential';
  if (type.includes('scanner'))    return 'pill-scanner';
  if (type.includes('traversal'))  return 'pill-traversal';
  if (type.includes('terminal'))   return 'pill-terminal';
  return 'pill-attack';
}

function fmtTime(ts) {
  if (!ts) return '--:--:--';
  const d = new Date(ts);
  return d.toLocaleTimeString('en-GB', { hour12: false });
}

function bumpCounters(type) {
  counters.total++;
  document.getElementById('stat-attacks').textContent = counters.total;
  if (type && type.includes('sql'))   { counters.sql_injection++; document.getElementById('stat-sql').textContent   = counters.sql_injection; }
  if (type && type.includes('xss'))   { counters.xss++;           document.getElementById('stat-xss').textContent   = counters.xss; }
  if (type && type.includes('brute')) { counters.brute_force++;   document.getElementById('stat-brute').textContent = counters.brute_force; }
}

function addEvent(attack, isNew) {
  eventCount++;
  document.getElementById('event-count').textContent = eventCount + ' events';

  const feed = document.getElementById('feed');
  const row  = document.createElement('div');
  row.className = 'feed-row' + (isNew ? ' new' : '');
  row.innerHTML = `
    <span class="time-col">${fmtTime(attack.timestamp)}</span>
    <span class="ip-col">${attack.ip || '—'}</span>
    <span class="type-pill ${pillClass(attack.attack_type)}">${(attack.attack_type || 'unknown').replace(/_/g,' ')}</span>
    <span class="path-col">${attack.path || '—'}</span>
  `;
  row.addEventListener('click', () => showDetail(attack));

  if (isNew) {
    feed.prepend(row);
    setTimeout(() => row.classList.remove('new'), 1500);
  } else {
    feed.appendChild(row);
  }
}

function showDetail(attack) {
  document.getElementById('detail-placeholder').style.display = 'none';
  const body = document.getElementById('detail-body');
  body.style.display = 'block';

  const featureNames = ['Path len', 'Payload len', 'SQL', 'XSS', 'Traversal', 'Params'];
  const features = attack.features || [];
  const maxVals  = [200, 500, 1, 1, 1, 20];

  const featureBars = featureNames.map((n, i) => {
    const v = features[i] ?? 0;
    const pct = Math.min(100, (v / maxVals[i]) * 100);
    return `<div class="feature-row">
      <span class="feature-name">${n}</span>
      <div style="flex:1;background:#21262d;height:6px;border-radius:3px;">
        <div class="feature-bar" style="width:${pct}%"></div>
      </div>
      <span class="feature-val">${v}</span>
    </div>`;
  }).join('');

  body.innerHTML = `
    <div class="detail-field"><div class="detail-key">IP Address</div><div class="detail-val">${attack.ip || '—'}</div></div>
    <div class="detail-field"><div class="detail-key">Attack Type</div><div class="detail-val">${(attack.attack_type || '—').replace(/_/g,' ')}</div></div>
    <div class="detail-field"><div class="detail-key">Path</div><div class="detail-val">${attack.path || '—'}</div></div>
    <div class="detail-field"><div class="detail-key">Method</div><div class="detail-val">${attack.method || '—'}</div></div>
    <div class="detail-field"><div class="detail-key">Time</div><div class="detail-val">${fmtTime(attack.timestamp)}</div></div>
    <div class="detail-field"><div class="detail-key">Session ID</div><div class="detail-val">${attack.session_id || '—'}</div></div>
    <div class="detail-field"><div class="detail-key">ML Features</div><div class="feature-bar-wrap">${featureBars}</div></div>
  `;
}
</script>
</body>
</html>
